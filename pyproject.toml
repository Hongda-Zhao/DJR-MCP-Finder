[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "djrmcp-finder"
version = "0.1.0"
description = "Protein language model pipeline for DJR MCP discovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hongda Zhao" },
]
maintainers = [
  { name = "Hongda Zhao" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "bioinformatics",
  "capsid-protein",
  "double-jelly-roll",
  "fasta",
  "machine-learning",
  "protein-language-model",
  "protein-classification",
  "viral-genomics",
  "virus-discovery",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "biopython>=1.81",
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
embedding = [
  "torch>=2.6",
  "transformers>=4.48",
]
benchmark = [
  "torch>=2.6",
  "transformers>=4.55",
  "sentence-transformers>=5.0",
  "sentencepiece>=0.2",
  "multimolecule>=0.2",
  "protobuf>=5",
]
benchmark-mimic = [
  "mimic @ git+https://github.com/PolymathicAI/MIMIC.git@15f5ef3050ea471b4c00e3f7d2be05165ff3dce8",
]
figure = [
  "matplotlib>=3.8",
  "pillow>=10",
]
dev = [
  "build>=1.2,<2",
  "pytest>=7.4",
  "ruff>=0.4",
  "tomli>=2; python_version < '3.11'",
  "twine>=5,<7",
]

[project.scripts]
djrmcp = "djrmcp_finder.cli:main"

[project.urls]
Homepage = "https://github.com/Hongda-Zhao/DJR-MCP-Finder"
Documentation = "https://github.com/Hongda-Zhao/DJR-MCP-Finder/tree/main/docs"
Repository = "https://github.com/Hongda-Zhao/DJR-MCP-Finder.git"
"Bug Tracker" = "https://github.com/Hongda-Zhao/DJR-MCP-Finder/issues"
Changelog = "https://github.com/Hongda-Zhao/DJR-MCP-Finder/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
djrmcp_finder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
