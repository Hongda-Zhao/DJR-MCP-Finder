[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djrmcp-finder"
version = "0.1.0"
description = "Protein language model pipeline for DJR MCP discovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hongda Zhao" },
]
license = { file = "LICENSE" }
keywords = [
  "bioinformatics",
  "protein-language-model",
  "protein-classification",
  "virus-discovery",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.81",
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
embedding = [
  "torch>=2.6",
  "transformers>=4.48",
]
benchmark = [
  "torch>=2.6",
  "transformers>=4.55",
  "sentence-transformers>=5.0",
  "sentencepiece>=0.2",
  "multimolecule>=0.2",
  "protobuf>=5",
]
benchmark-mimic = [
  "mimic @ git+https://github.com/PolymathicAI/MIMIC.git@15f5ef3050ea471b4c00e3f7d2be05165ff3dce8",
]
figure = [
  "matplotlib>=3.8",
  "pillow>=10",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]

[project.scripts]
djrmcp = "djrmcp_finder.cli:main"

[project.urls]
Homepage = "https://github.com/Hongda-Zhao/DJR-MCP-Finder"
Documentation = "https://github.com/Hongda-Zhao/DJR-MCP-Finder#readme"
Issues = "https://github.com/Hongda-Zhao/DJR-MCP-Finder/issues"
Repository = "https://github.com/Hongda-Zhao/DJR-MCP-Finder.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
