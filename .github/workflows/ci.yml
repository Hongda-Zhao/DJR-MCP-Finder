name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tooling
        run: python -m pip install 'ruff>=0.4,<1'
      - name: Check critical Python errors
        run: make lint PYTHON=python

  documentation-and-metadata:
    name: Documentation and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check documentation and version contracts
        run: make metadata docs-check PYTHON=python

  core-tests:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: make setup-core PYTHON=python
      - name: Run core tests
        run: make test-core PYTHON=python

  formal-inference-tests:
    name: Formal Model V0 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install formal inference package
        run: make setup-v0 PYTHON=python
      - name: Run formal package tests
        run: make test-v0 PYTHON=python
      - name: Run CPU-only smoke checks
        run: make smoke-v0

  candidate-inference-tests:
    name: Model V0.1 Candidate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install candidate inference package
        run: make setup-v01 PYTHON=python
      - name: Run candidate package tests
        run: make test-v01 PYTHON=python
      - name: Run CPU-only smoke checks
        run: make smoke-v01

  packages:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install 'build>=1.2,<2' 'twine>=5,<7'
      - name: Build and validate all distributions
        run: make package-check PYTHON=python BUILD_DIR=build/ci-release
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: build/ci-release/*/*
          if-no-files-found: error
