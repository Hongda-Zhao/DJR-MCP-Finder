name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lint tooling
        run: python -m pip install 'ruff>=0.4,<1'
      - name: Check critical Python errors
        run: >-
          python -m ruff check --select E9,F63,F7,F82
          src tests scripts
          user-inference-v0/src user-inference-v0/tests

  core-tests:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run core tests
        run: python -m pytest -q

  formal-inference-tests:
    name: Formal V0 package tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install formal V0 package
        run: python -m pip install -e './user-inference-v0[dev]'
      - name: Run package tests
        run: python -m pytest -q user-inference-v0/tests
      - name: Run CPU-only smoke checks
        run: |
          djrmcp-predict validate-fasta user-inference-v0/examples/synthetic_example.faa
          djrmcp-predict model-info
