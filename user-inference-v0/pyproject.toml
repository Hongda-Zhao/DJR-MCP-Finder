[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "djrmcp-user-inference"
version = "0.1.0"
description = "Frozen project-V0 ESM-C 6B inference for user-provided protein FASTA files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hongda Zhao" },
]
maintainers = [
  { name = "Hongda Zhao" },
]
requires-python = ">=3.10"
keywords = [
  "bioinformatics",
  "capsid-protein",
  "fasta",
  "protein-classification",
  "protein-language-model",
  "viral-genomics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
inference = [
  "torch>=2.6",
  "transformers @ git+https://github.com/Biohub/transformers.git@ef32577f55da19a4989cd7b22e004dc43a4998cb",
]
dev = [
  "build>=1.2,<2",
  "pytest>=7.4",
  "ruff>=0.4",
  "twine>=5,<7",
]

[project.scripts]
djrmcp-predict = "djrmcp_predict.cli:main"

[project.urls]
Homepage = "https://github.com/Hongda-Zhao/DJR-MCP-Finder"
Repository = "https://github.com/Hongda-Zhao/DJR-MCP-Finder"
Documentation = "https://github.com/Hongda-Zhao/DJR-MCP-Finder/tree/main/user-inference-v0"
"Bug Tracker" = "https://github.com/Hongda-Zhao/DJR-MCP-Finder/issues"
Changelog = "https://github.com/Hongda-Zhao/DJR-MCP-Finder/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
djrmcp_predict = [
  "py.typed",
  "assets/project-v0-esmc6b-r1/*.json",
  "assets/project-v0-esmc6b-r1/*.md",
  "assets/project-v0-esmc6b-r1/*.sha256",
  "assets/project-v0-esmc6b-r1/heads/*.npz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
