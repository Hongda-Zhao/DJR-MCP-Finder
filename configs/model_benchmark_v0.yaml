paths:
  v0_manifest: data/processed/v0/master_manifest.tsv
  v0_fasta: data/interim/v0/model_representatives.faa
  embedding_output: data/processed/embeddings/model_benchmark_placeholder
  result_output: results/model_benchmark_v0/placeholder
  # The canonical production manifest resolves its append-only/O_EXCL Test
  # lifecycle state in code to the fixed external DJRMCP_Develope registry.
  # Production paths.test_state_dir overrides are intentionally forbidden;
  # only non-production test manifests may supply a temporary state directory.
  # Immutable Train-only component fold map shared by all three heads and all
  # 14 representation candidates.  It must be frozen before any calibration.
  benchmark_cv_fold_map: results/model_benchmark_v0/frozen_global_component_folds.tsv
  benchmark_cv_fold_metadata: results/model_benchmark_v0/frozen_global_component_folds.json
  known_output: data/interim/known_mcps
  dataset_output: data/processed/v0

embedding:
