  model_loader: auto
  tokenizer_loader: auto
  sequence_format: raw
  sequence_prefix: ""
  replace_rare_with_x: false
  trust_remote_code: false
  record_batch_size: 1
  window_batch_size: 1
  window_residues: 1022
  stride: 511
  precision: float16
  output_dtype: float16
  device: auto

